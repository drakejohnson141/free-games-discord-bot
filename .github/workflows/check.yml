name: Free Games Bot
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node index.js
        env:
          DISCORD_WEBHOOK_EPIC: ${{ secrets.DISCORD_WEBHOOK_EPIC }}
          DISCORD_WEBHOOK_STEAM: ${{ secrets.DISCORD_WEBHOOK_STEAM }}
          DISCORD_WEBHOOK_GOG: ${{ secrets.DISCORD_WEBHOOK_GOG }}
          DISCORD_WEBHOOK_LEGACY: ${{ secrets.DISCORD_WEBHOOK_LEGACY }}
